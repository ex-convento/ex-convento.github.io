<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bar · Ex Convento</title>
<meta name="theme-color" content="#0d0b09">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bar Ex Convento">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Josefin+Sans:wght@600;700&display=swap">
<link rel="stylesheet" href="../comune.css">
<style>
  body{display:flex;flex-direction:column;min-height:100dvh}
  .main{flex:1;display:flex;min-height:0}
  .prod{flex:1;padding:16px;overflow:auto}
  .griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .p{position:relative;background:var(--sup);border-radius:var(--r);box-shadow:var(--ombra);min-height:110px;padding:14px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;border-top:6px solid var(--c,var(--ambra));transition:transform .08s}
  .p:active{transform:scale(.96)}
  .p .n{font-weight:700;font-size:18px;line-height:1.2}
  .p .pr{font:700 20px/1 var(--display);color:var(--muted)}
  .p .q{position:absolute;top:10px;right:10px;min-width:32px;height:32px;border-radius:16px;background:var(--nero);color:var(--ambra);font-weight:700;display:grid;place-items:center;padding:0 8px}
  .p .q + .n{padding-right:30px}
  .p.flash{animation:fl .3s}
  @keyframes fl{50%{transform:scale(.94)}}
  .avviso{background:var(--ocra-soft);color:var(--ocra);border-radius:var(--r-sm);padding:10px 14px;font-weight:700;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

  .scontrino{width:380px;flex:none;background:var(--sup);border-left:1px solid var(--linea);display:flex;flex-direction:column;min-height:0}
  .sc-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
  .righe{flex:1;overflow:auto;padding:0 12px}
  .riga{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--linea)}
  .riga .nm{flex:1;font-weight:700;line-height:1.2}
  .riga .nm small{display:block;font-weight:400;color:var(--muted)}
  .qbtn{width:44px;height:44px;border-radius:50%;background:var(--sup2);font-size:22px;font-weight:700}
  .riga .qq{min-width:26px;text-align:center;font-weight:700;font-size:18px}
  .riga .tt{min-width:76px;text-align:right;font-weight:700}
  .tot{padding:14px 18px;border-top:2px solid var(--linea)}
  .tot .cifra{display:flex;justify-content:space-between;align-items:baseline;font:700 34px/1 var(--display);margin-bottom:12px}
  .tot .cifra span:first-child{font-size:18px;color:var(--muted)}
  .paga{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .barra{display:none}
  .inDlg .sc-h h2{visibility:hidden}
  .inDlg .sc-h{padding-top:0}
  @media (max-width:820px){
    .scontrino{display:none}
    .prod{padding:12px 12px 100px}
    .griglia{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
    .p{min-height:96px}
    .barra{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--nero);color:#fff;padding:12px 14px;padding-bottom:max(12px,env(safe-area-inset-bottom));gap:12px;align-items:center}
    .barra .info{flex:1;font-weight:700}
    .barra .info b{display:block;font:700 24px/1.1 var(--display);color:var(--ambra)}
    .barra .btn{min-height:54px}
  }
  .tasti{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
  .tasti button{min-height:58px;border-radius:var(--r-sm);background:var(--sup2);font-weight:700;font-size:19px}
  .resto{display:flex;justify-content:space-between;align-items:baseline;background:var(--verde-soft);color:var(--verde);border-radius:var(--r-sm);padding:14px 16px;font:700 26px/1 var(--display)}
  .resto.no{background:var(--rosso-soft);color:var(--rosso)}
  .resto span:first-child{font-size:16px}
  /* Pagamento in contanti: su telefono tutto in colonna (conferma subito sotto il resto), su tablet in due colonne */
  .pagaC{display:flex;flex-direction:column}
  .pagaC .pcSx{display:flex;flex-direction:column;gap:10px}
  .pagaC #resto:empty{display:none}
  .pagaC .tasti{margin:12px 0 0}
  @media (min-width:700px){
    dialog[data-k="contanti"]{width:min(780px,calc(100vw - 24px))}
    .pagaC{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
    .pagaC .tasti{margin:0}
  }
  @media (max-height:700px){
    .tasti{gap:6px}
    .tasti button{min-height:46px;font-size:18px}
    .resto{padding:10px 14px;font-size:22px}
    dialog[data-k="contanti"] .dlg-h{padding:10px 16px 2px}
    dialog[data-k="contanti"] .dlg-b{padding:6px 16px 14px}
  }

  .pann{padding:16px;max-width:900px;margin:0 auto;width:100%}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
  .kpi .card b{display:block;font:700 28px/1.1 var(--display);margin-top:4px}
  .lista .el{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--linea)}
  .lista .el .d{flex:1;min-width:0}
  .lista .el .d small{display:block;color:var(--muted)}
  .lista .el.ann{opacity:.5;text-decoration:line-through}
  .lst{width:100%;border-collapse:collapse}
  .lst td{padding:6px 4px;vertical-align:middle}
  .lst input,.lst select{width:100%;min-height:46px;border:2px solid var(--linea);border-radius:10px;padding:6px 10px;font:inherit;background:var(--sup)}
  .lst .pz{width:96px}
  .cassabtn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:12px;background:#151412;border:1px solid #2c2a26;color:#f4efe4;font-weight:700;font-size:15px;white-space:nowrap;max-width:34vw;overflow:hidden;text-overflow:ellipsis}
  .cassabtn i{width:9px;height:9px;border-radius:50%;background:#8f887b;flex:none}
  body.evento .cassabtn{background:var(--ambra);border-color:var(--ambra);color:#111}
  body.evento .cassabtn i{background:#111}
  body.evento .tabs{box-shadow:inset 0 -3px 0 var(--ambra)}
  .evbanner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--nero);color:#f4efe4;border-radius:var(--r-sm);padding:10px 14px;margin-bottom:12px;border-left:6px solid var(--ambra)}
  .evbanner b{color:var(--ambra);font:700 17px/1.2 var(--display);letter-spacing:.04em}
  .evbanner span{flex:1;min-width:160px;font-size:14px;color:#cfc6b6}
  .cassalist{display:flex;flex-direction:column;gap:10px}
  .cassaopt{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:14px;background:var(--sup2);border:2px solid transparent;width:100%}
  .cassaopt.on{border-color:var(--ambra);background:var(--ambra-soft)}
  .cassaopt .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--nero);color:var(--ambra);font-size:22px;flex:none}
  .cassaopt b{display:block;font-size:18px}
  .cassaopt small{color:var(--muted)}
  .check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);background:var(--sup2);margin:12px 0;font-weight:700;cursor:pointer}
  .check input{width:24px;height:24px;flex:none;margin:0;accent-color:var(--ambra)}
  .check small{display:block;font-weight:400;color:var(--muted)}
  @media (max-width:560px){.cassabtn{max-width:30vw;padding:0 10px;height:38px;font-size:14px}}
  /* Tablet orizzontale (es. 10" in verticale basso): schede dentro la testata, prodotti più fitti, scontrino sempre visibile */
  .top .tabs{position:static;background:none;padding:0;margin:0 0 0 6px;flex:0 1 auto;min-width:0;align-self:stretch;align-items:stretch}
  .top .tab{padding:0 12px;display:flex;align-items:center}
  @media (min-width:821px){
    body{height:100dvh;overflow:hidden}
    .main{overflow:auto}
    .prod{height:100%}
    .scontrino{height:100%}
  }
  @media (min-width:821px) and (max-height:860px){
    .top{padding:6px 12px;padding-top:max(6px,env(safe-area-inset-top));gap:8px;min-height:52px}
    .top .brand img{width:36px;height:auto}
    .top .brand b{font-size:15px}
    .top .brand small{font-size:10px;margin-top:2px}
    .top .tab{font-size:15px;padding:0 10px}
    .chip,.cassabtn{height:38px;font-size:14px;padding:0 11px}
    .sync{font-size:12px;padding:5px 9px}
    .prod{padding:10px 12px}
    .scelte{gap:6px}
    .prod .scelta{min-height:40px;padding:0 14px;font-size:15px}
    .griglia{grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:9px}
    .p{min-height:84px;padding:10px 12px;border-top-width:5px}
    .p .n{font-size:16px}
    .p .pr{font-size:17px}
    .p .q{top:7px;right:7px;min-width:28px;height:28px}
    .scontrino{width:310px}
    .sc-h{padding:10px 14px 4px}
    .sc-h h2{font-size:19px}
    .riga{padding:7px 4px;gap:8px}
    .qbtn{width:40px;height:40px;font-size:20px}
    .tot{padding:10px 14px}
    .tot .cifra{font-size:30px;margin-bottom:9px}
    .paga .btn{min-height:56px}
    .evbanner{padding:8px 12px;margin-bottom:10px}
  }
  @media (max-width:640px){.lst tr{display:grid;grid-template-columns:1fr 96px 44px;gap:6px;padding:8px 0;border-bottom:1px solid var(--linea)}.lst td{padding:0}.lst td.g{grid-column:1/2}.lst td.c{grid-column:2/4}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="../logo.png" alt="" width="45" height="34"><div><b>EX CONVENTO</b><small>Bar</small></div></div>
  <div class="spazio"></div>
  <span id="sync" class="sync">…</span>
  <button id="cassaBtn" class="cassabtn" aria-label="Scegli la cassa"><i></i><span>Bar</span></button>
  <button id="opBtn" class="chip vuoto" aria-label="Chi è al banco">Chi è al banco?</button>
</header>
<nav class="tabs" id="viste">
  <button class="tab on" data-v="cassa">Cassa</button>
  <button class="tab" data-v="oggi">Oggi</button>
  <button class="tab" data-v="chiudi">Chiudi cassa</button>
  <button class="tab" data-v="scorte">Scorte</button>
  <button class="tab" data-v="listino">Listino</button>
</nav>
<div id="app" class="main"></div>
<div class="barra" id="barra"></div>
<dialog id="dlg"></dialog>

<script src="../comune.js"></script>
<script src="../totore.js" defer></script>
<script>
(function () {
  'use strict';
  var X = window.EXC, $ = function (s, r) { return (r || document).querySelector(s); };
  var COL = ['#FEA501', '#2f6f9a', '#1b7a4a', '#b33f28', '#94660a', '#7d4f9a', '#4f4a42', '#2f8f8a'];
  var S = {vista: 'cassa', gruppo: 'Tutti', carrello: [], listino: [], esempio: false, operatori: [], postazione: '', cassa: X.get('cassaAttiva', ''), casseEventi: [], eventiVicini: [], noteCasse: X.get('casseNote', {})};
  var dlg = $('#dlg');

  function vendite() { return X.get('vendite', []); }
  function salvaVendite(v) { var lim = X.oggi(new Date(Date.now() - 21 * 864e5)); X.set('vendite', v.filter(function (x) { return !x.chiusa || x.data >= lim; }).slice(-3000)); }
  // Chi è al banco vale per un'operazione: si sceglie al momento di incassare e si azzera un minuto dopo l'ultima operazione
  // (5 minuti se è stato scelto ma non si è ancora registrato niente). Così ogni vendita ha il nome giusto.
  var OP_DOPO = 60000, OP_ATTESA = 300000;
  function operatore() {
    var n = X.get('operatore', ''), sc = Number(X.get('opScade', 0)) || 0;
    if (n && Date.now() > sc) { X.set('operatore', ''); n = ''; }
    return n;
  }
  function segnaOperazione() { if (X.get('operatore', '')) X.set('opScade', Date.now() + OP_DOPO); }
  function aggiornaOp() {
    var op = operatore(), ob = $('#opBtn'); if (!ob) return;
    var html = op ? '<span class="lbl">Al banco: </span>' + X.esc(op) : 'Chi è al banco?';
    if (ob.innerHTML !== html) { ob.innerHTML = html; ob.classList.toggle('vuoto', !op); }
  }
  setInterval(aggiornaOp, 5000);

  /* ---------- dati dal gestionale ---------- */
  /* ---------- cassa attiva: quella di tutti i giorni o la cassa di un evento ---------- */
  function cassaEv() { return S.cassa ? (S.casseEventi.filter(function (c) { return c.id === S.cassa; })[0] || S.noteCasse[S.cassa] || null) : null; }
  function stessaCassa(v) { return (v.evento || '') === (S.cassa || ''); }
  function applicaCassa() {
    var ce = cassaEv();
    if (S.cassa && !ce) { S.cassa = ''; X.set('cassaAttiva', ''); }
    S.listino = (ce ? ce.listino : (S.listinoTutto || [])).filter(function (p) { return !p.nascosto; });
    document.body.classList.toggle('evento', !!ce);
    var b = $('#cassaBtn'); if (b) b.querySelector('span').textContent = ce ? ce.nome : 'Bar';
    if (S.gruppo !== 'Tutti' && gruppi().indexOf(S.gruppo) < 0) S.gruppo = 'Tutti';
  }
  function usaCassa(id) {
    if (S.carrello.length) return X.toast('Prima completa o svuota lo scontrino.', 'err');
    S.cassa = id || ''; X.set('cassaAttiva', S.cassa); applicaCassa(); chiudiDlg(); S.vista = 'cassa'; render();
    var ce = cassaEv(); X.toast(ce ? 'Cassa evento: ' + ce.nome : 'Cassa del bar di tutti i giorni', 'ok');
  }
  function suStato(s) {
    if (s.listino) { S.listinoTutto = s.listino.prodotti || []; S.esempio = !!s.listino.esempio; }
    if (s.casseEventi && s.casseEventi.ok) {
      S.casseEventi = s.casseEventi.values || [];
      var nota = {}; S.casseEventi.forEach(function (c) { nota[c.id] = c; });
      Object.keys(S.noteCasse).forEach(function (id) { if (!nota[id] && vendite().some(function (v) { return v.evento === id && !v.chiusa; })) nota[id] = S.noteCasse[id]; });
      S.noteCasse = nota; X.set('casseNote', nota);
    }
    if (s.eventiVicini && s.eventiVicini.ok) S.eventiVicini = s.eventiVicini.values || [];
    if (s.scorteBasse && s.scorteBasse.ok) S.scorteBasse = s.scorteBasse.values || [];
    applicaCassa();
    S.operatori = s.operatori || [];
    S.postazione = s.postazione || '';
    if (S.vista === 'cassa' || (S.vista === 'scorte' && !document.querySelector('#scDlg[open]')) || (S.vista === 'listino' && !document.querySelector('#lstBody'))) render();
  }

  /* ---------- carrello ---------- */
  function totale() { return Math.round(S.carrello.reduce(function (s, r) { return s + r.q * r.prezzo; }, 0) * 100) / 100; }
  function pezzi() { return S.carrello.reduce(function (s, r) { return s + r.q; }, 0); }
  function aggiungi(id) {
    var p = S.listino.filter(function (x) { return x.id === id; })[0]; if (!p) return;
    var r = S.carrello.filter(function (x) { return x.id === id; })[0];
    if (r) r.q++; else S.carrello.push({id: p.id, nome: p.nome, prezzo: Number(p.prezzo), cassa: p.cassa || 'BAR', q: 1});
    if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {}
    render(); var b = document.querySelector('.p[data-id="' + CSS.escape(id) + '"]'); if (b) b.classList.add('flash');
  }
  function cambiaQ(id, d) {
    var r = S.carrello.filter(function (x) { return x.id === id; })[0]; if (!r) return;
    r.q += d; if (r.q <= 0) S.carrello = S.carrello.filter(function (x) { return x !== r; });
    render(); if (dlg.open && dlg.dataset.k === 'scontrino') apriScontrino();
  }

  /* ---------- viste ---------- */
  function render() {
    document.querySelectorAll('#viste .tab').forEach(function (t) { t.classList.toggle('on', t.dataset.v === S.vista); });
    aggiornaOp();
    var a = $('#app');
    $('#barra').style.display = S.vista === 'cassa' && window.matchMedia('(max-width:820px)').matches ? 'flex' : 'none';
    if (S.vista === 'cassa') a.innerHTML = vCassa();
    else if (S.vista === 'oggi') a.innerHTML = vOggi();
    else if (S.vista === 'chiudi') a.innerHTML = vChiudi();
    else if (S.vista === 'scorte') a.innerHTML = X.vScorte(X.scorteFiltro());
    else a.innerHTML = vListino();
    var nb = X.scorteBasse(), tb = document.querySelector('#viste [data-v="scorte"]'); if (tb) tb.innerHTML = 'Scorte' + (nb ? ' <span class="badge ros">' + nb + '</span>' : '');
    if (S.vista === 'cassa') $('#barra').innerHTML = S.carrello.length
      ? '<div class="info">' + pezzi() + (pezzi() === 1 ? ' articolo' : ' articoli') + '<b>' + X.euro(totale()) + '</b></div><button class="btn amb" data-act="scontrino">Incassa ›</button>'
      : '<div class="info muted" style="color:#cfc6b6">Tocca i prodotti per aggiungerli</div>';
  }
  function gruppi() { var g = []; S.listino.forEach(function (p) { if (g.indexOf(p.gruppo) < 0) g.push(p.gruppo); }); return g; }
  function colore(g) { var i = gruppi().indexOf(g); return COL[(i < 0 ? 0 : i) % COL.length]; }

  function vCassa() {
    var gs = gruppi(), h = '<section class="prod">', ce = cassaEv();
    if (ce) h += '<div class="evbanner"><b>' + X.esc(ce.nome) + '</b><span>Cassa evento' + (ce.data ? ' del ' + ce.data.slice(8) + '/' + ce.data.slice(5, 7) : '') + ': prezzi dell\'evento, incassi in EVENTI.</span><button class="btn lin" data-act="casse" style="min-height:40px;color:#fff;border-color:#3a362f">Cambia cassa</button></div>';
    if (S.esempio && !ce) h += '<div class="avviso">Prodotti e prezzi di esempio: aggiorna il listino prima di usare la cassa. <button class="btn amb" data-v-go="listino" style="min-height:42px">Apri listino</button></div>';
    if (!S.listino.length) h += '<div class="card vuota">' + (ce ? 'Il listino di questo evento è vuoto. <button class="btn amb" data-v-go="listino" style="min-height:42px;margin-left:8px">Prepara il listino</button>' : 'Il listino non è ancora arrivato. Serve un attimo di rete la prima volta.') + '</div>';
    if (gs.length > 1) h += '<div class="scelte" style="margin-bottom:12px">' + ['Tutti'].concat(gs).map(function (g) { return '<button class="scelta' + (S.gruppo === g ? ' on' : '') + '" data-g="' + X.esc(g) + '">' + X.esc(g) + '</button>'; }).join('') + '</div>';
    h += '<div class="griglia">' + S.listino.filter(function (p) { return S.gruppo === 'Tutti' || p.gruppo === S.gruppo; }).map(function (p) {
      var r = S.carrello.filter(function (x) { return x.id === p.id; })[0];
      return '<button class="p" data-id="' + X.esc(p.id) + '" style="--c:' + colore(p.gruppo) + '">' + (r ? '<span class="q">' + r.q + '</span>' : '') +
        '<span class="n">' + X.esc(p.nome) + '</span><span class="pr">' + X.euro(p.prezzo) + '</span></button>';
    }).join('') + '</div></section>';
    h += '<aside class="scontrino">' + scontrinoHtml() + '</aside>';
    return h;
  }
  function scontrinoHtml() {
    var h = '<div class="sc-h"><h2 style="margin:0">Scontrino</h2>' + (S.carrello.length ? '<button class="btn lin" data-act="svuota" style="min-height:40px;padding:0 12px">Svuota</button>' : '') + '</div><div class="righe">';
    if (!S.carrello.length) { var ult = ultimaVendita(); h += '<div class="vuota">Tocca i prodotti a sinistra per aggiungerli.' + (ult ? '<br><button class="btn lin" data-act="ripeti" style="margin-top:14px;min-height:44px">Ripeti l\'ultimo: ' + X.esc(ult.righe.map(function (r) { return r.q + '× ' + r.nome; }).join(', ')) + '</button>' : '') + '</div>'; }
    h += S.carrello.map(function (r) {
      return '<div class="riga"><div class="nm">' + X.esc(r.nome) + '<small>' + X.euro(r.prezzo) + '</small></div>' +
        '<button class="qbtn" data-q="-1" data-id="' + X.esc(r.id) + '" aria-label="Togli">−</button><span class="qq">' + r.q + '</span>' +
        '<button class="qbtn" data-q="1" data-id="' + X.esc(r.id) + '" aria-label="Aggiungi">+</button><span class="tt">' + X.euro(r.q * r.prezzo) + '</span></div>';
    }).join('');
    h += '</div><div class="tot"><div class="cifra"><span>Totale</span><span>' + X.euro(totale()) + '</span></div>' +
      '<div class="paga"><button class="btn ver big" data-pay="contanti"' + (S.carrello.length ? '' : ' disabled') + '>Contanti</button>' +

  function scegliCassa() {
    var ap = function (id) { return vendite().filter(function (v) { return (v.evento || '') === id && !v.chiusa && v.totale; }).length; };
    var opt = function (id, ic, nome, sub) { var n = ap(id); return '<button class="cassaopt' + ((S.cassa || '') === id ? ' on' : '') + '" data-cassa="' + X.esc(id) + '"><span class="ic">' + ic + '</span><span><b>' + X.esc(nome) + '</b><small>' + X.esc(sub) + (n ? ' · ' + n + ' vendite da chiudere' : '') + '</small></span></button>'; };
    var h = '<div class="cassalist">' + opt('', '\u2615', 'Bar di tutti i giorni', 'Listino normale, incassi in BAR');
    S.casseEventi.forEach(function (c) { h += opt(c.id, '\u{1F389}', c.nome, (c.data ? c.data.slice(8) + '/' + c.data.slice(5, 7) + ' · ' : '') + c.listino.length + ' voci · incassi in EVENTI'); });
    h += '</div><button class="btn amb big full" data-act="nuovaCassa" style="margin-top:16px">+ Nuova cassa evento</button>' +
      '<p class="muted" style="font-size:14px;margin-bottom:0">La cassa evento ha prezzi suoi e i piatti del giorno. Si può preparare anche dal gestionale, giorni prima.</p>';
    apri('casse', 'Quale cassa usi?', h);
  }
  function nuovaCassa() {
    var oggi = X.oggi(), ev = S.eventiVicini.filter(function (e) { return e.data >= oggi; }).concat(S.eventiVicini.filter(function (e) { return e.data < oggi; }).reverse());
    var h = (ev.length ? '<label class="campo"><span>Evento del calendario</span><select id="ceEv"><option value="">— nessuno, scrivo il nome —</option>' + ev.map(function (e) { return '<option value="' + X.esc(e.id) + '" data-t="' + X.esc(e.titolo) + '" data-d="' + X.esc(e.data) + '"' + (e.data === oggi ? ' selected' : '') + '>' + X.esc(e.data.slice(8) + '/' + e.data.slice(5, 7) + ' · ' + e.titolo) + '</option>'; }).join('') + '</select></label>' : '') +
      '<label class="campo"><span>Nome della cassa</span><input id="ceNome" placeholder="es. Festa d\'autunno" autocomplete="off"></label>' +
      '<label class="campo"><span>Data</span><input id="ceData" type="date" value="' + oggi + '"></label>' +
      '<p class="muted" style="font-size:14px">Si parte da una copia del listino del bar: dopo potrai cambiare i prezzi e aggiungere i piatti del giorno.</p>' +
      '<button class="btn prim big full" data-act="creaCassa">Continua</button>';
    apri('nuovaCassa', 'Nuova cassa evento', h);
    var sel = $('#ceEv'), aggiorna = function () { var o = sel && sel.selectedOptions[0]; if (o && o.value) { $('#ceNome').value = o.dataset.t; $('#ceData').value = o.dataset.d; } };
    if (sel) { sel.addEventListener('change', aggiorna); aggiorna(); }
  }
  function creaCassa() {
    var nome = (($('#ceNome') || {}).value || '').trim(), data = ($('#ceData') || {}).value || X.oggi(), ev = ($('#ceEv') || {}).value || '';
    if (nome.length < 2) return X.toast('Scrivi il nome della cassa evento.', 'err');
    var listino = (S.listinoTutto || []).filter(function (p) { return !p.nascosto; }).map(function (p) {
      return {id: p.id, nome: p.nome, prezzo: p.prezzo, gruppo: p.gruppo, cassa: !p.cassa || p.cassa === 'BAR' ? 'EVENTI' : p.cassa};
    });
    if (!listino.length) listino = [{id: '', nome: 'Piatto del giorno', prezzo: 0, gruppo: 'Cucina', cassa: 'EVENTI'}];
    S.dopoPin = function (pin, b, lbl) {
      salvaCassaServer(pin, {nome: nome, data: data, evento: ev, listino: listino}, function (j) {
        S.dopoPin = null; S.carrello = []; S.cassa = j.cassaId || ''; X.set('cassaAttiva', S.cassa); applicaCassa(); S.vista = 'listino';
        X.toast('Cassa evento creata: ora sistema prezzi e piatti del giorno', 'ok');
      }, b, lbl);
    };
    chiediPin('Crea la cassa evento');
  }
  function archiviaCassa() {
    var ce = cassaEv(); if (!ce) return;
    S.dopoPin = function (pin, b, lbl) {
      salvaCassaServer(pin, {id: ce.id, nome: ce.nome, data: ce.data, evento: ce.evento, listino: ce.listino, stato: 'chiusa'}, function () {
        S.dopoPin = null; S.cassa = ''; X.set('cassaAttiva', ''); applicaCassa(); S.vista = 'cassa'; X.toast('Cassa evento archiviata', 'ok');
      }, b, lbl);
    };
    chiediPin('Archivia la cassa evento');
  }

  /* ---------- configurazione iniziale ---------- */
  function setup() {
    $('#viste').style.display = 'none'; $('#barra').style.display = 'none';
    $('#app').innerHTML = '<div class="setup"><div class="card"><h2>Configura questa postazione</h2>' +
      '<p class="muted">Apri su questo dispositivo il link della postazione Bar (lo trovi nel gestionale, scheda Accessi) oppure incolla qui la chiave. Va bene anche il tuo PIN personale, se è il tuo telefono.</p>' +
      '<label class="campo"><span>Chiave o PIN</span><input id="kIn" autocomplete="off"></label><button class="btn prim full big" data-act="setK">Collega</button></div></div>';
  }
  function provaChiave() {
    var v = ($('#kIn') || {}).value || ''; v = v.trim(); var m = v.match(/[?&]k=([^&]+)/); if (m) v = decodeURIComponent(m[1]);
    if (!v) return;
    X.salvaChiave(v);
    var b = $('[data-act="setK"]'); if (b) { b.disabled = true; b.textContent = 'Controllo…'; }
    X.call('init').then(function (j) {
      X.set('stato', j); $('#viste').style.display = ''; suStato(j); render(); X.toast('Postazione collegata: ' + j.postazione, 'ok'); X.sync(true);
    }, function (e) {
      X.salvaChiave(''); if (b) { b.disabled = false; b.textContent = 'Collega'; }
      X.toast(e.server ? 'Chiave o PIN non valido.' : 'Serve la rete per il primo collegamento.', 'err');
    });
  }

  /* ---------- eventi ---------- */
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button'); if (!t) return;
    var d = t.dataset;
    if (d.v) { S.vista = d.v; chiudiDlg(); render(); window.scrollTo(0, 0); return; }
    if (d.vGo) { S.vista = d.vGo; render(); return; }
    if (d.g) { S.gruppo = d.g; render(); return; }
    if (d.id && t.classList.contains('p')) return aggiungi(d.id);
    if (d.q) return cambiaQ(d.id, Number(d.q));
    if (d.pay) return paga(d.pay);
    if (d.ann) return annulla(d.ann);
    if (d.op) { return usaOperatore(d.op); }
    if (d.mot) { [].forEach.call(t.parentNode.children, function (b) { b.classList.toggle('on', b === t); }); return; }
    if (d.ric) { S.ricevuto = String(d.ric).replace('.', ','); aggiornaResto(); return; }
    if (d.tasto) {
      if (d.tasto === '⌫') S.ricevuto = S.ricevuto.slice(0, -1);
      else if (!(d.tasto === ',' && S.ricevuto.indexOf(',') >= 0) && S.ricevuto.length < 7) S.ricevuto += d.tasto;
      aggiornaResto(); return;
    }
    if (t.id === 'opBtn') return scegliOperatore();
    if (t.id === 'cassaBtn') return scegliCassa();
    if (d.cassa !== undefined) return usaCassa(d.cassa);
    switch (d.act) {
      case 'x': return chiudiDlg();
      case 'scontrino': return apriScontrino();
      case 'svuota': S.carrello = []; chiudiDlg(); return render();
      case 'ripeti': { var u = ultimaVendita(); if (u) { S.carrello = u.righe.filter(function (r) { return r.q > 0; }).map(function (r) { return {id: r.id, nome: r.nome, prezzo: r.prezzo, cassa: r.cassa, q: r.q}; }); render(); } return; }
      case 'confCarta': return registraVendita('carta');
      case 'confContanti': return registraVendita('contanti');
      case 'confOmaggio': { var mb = document.querySelector('#omMot .on'); return registraVendita('omaggio', {motivo: mb ? mb.dataset.mot : 'Omaggio', perChi: X.ricordaNome(($('#omChi') || {}).value || '')}); }
      case 'confAnn': return confermaAnnullo(d.id);
      case 'chiudi': return chiudiCassa();
      case 'pulisciErr': X.set('errori', []); X.aggiornaStato(); return render();
      case 'addProd': $('#lstBody').insertAdjacentHTML('beforeend', rigaListino(null, cassaEv() ? 'EVENTI' : 'BAR')); return;
      case 'addPiatto': { $('#lstBody').insertAdjacentHTML('beforeend', rigaListino({id: '', nome: '', prezzo: '', gruppo: 'Cucina', cassa: 'EVENTI'})); var ins = document.querySelectorAll('#lstBody .ln'); ins[ins.length - 1].focus(); return; }
      case 'casse': return scegliCassa();
      case 'nuovaCassa': return nuovaCassa();
      case 'creaCassa': return creaCassa();
      case 'archivia': return archiviaCassa();
      case 'delProd': t.closest('tr').remove(); return;
      case 'salvaListino': return salvaListino();
      case 'confListino': return confermaListino();
      case 'setK': return provaChiave();
      case 'opOk': {
        var sel = document.querySelector('[data-op].on'), nome = ($('#opNome').value || '').trim() || (sel ? sel.dataset.op : '');
        if (!nome) return X.toast('Scegli o scrivi un nome.', 'err');
        return usaOperatore(nome);
      }
    }
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.id === 'contati') {
      var s = somme(aperte()), v = Number(ev.target.value.replace(',', '.')), el = $('#diff');
      if (!ev.target.value || isNaN(v)) { el.textContent = ''; return; }
      var df = Math.round((v - s.contanti) * 100) / 100;
      el.textContent = df === 0 ? 'Il conto torna.' : (df > 0 ? 'Ci sono ' + X.euro(df) + ' in più.' : 'Mancano ' + X.euro(-df) + '.');
      el.style.color = df === 0 ? 'var(--verde)' : 'var(--rosso)';
    }
  });
  dlg.addEventListener('click', function (ev) { if (ev.target === dlg) chiudiDlg(); });
  window.matchMedia('(max-width:820px)').addEventListener('change', function () { layout(); render(); });
  // Sul tablet in orizzontale le schede stanno nella testata: più spazio per i prodotti
  function layout() {
    var top = $('.top'), nav = $('#viste'), wide = window.matchMedia('(min-width:821px)').matches;
    if (wide && nav.parentNode !== top) top.insertBefore(nav, top.querySelector('.spazio'));
    else if (!wide && nav.parentNode === top) top.parentNode.insertBefore(nav, top.nextSibling);
  }
  layout();
  // Totore passeggia sopra i prodotti (mai sullo scontrino) e fa le fusa quando si vende
  window.TOTORE_AREA = function () {
    var sc = document.querySelector('.scontrino'), br = $('#barra'), w = window.innerWidth;
    var sw = sc && getComputedStyle(sc).display !== 'none' && S.vista === 'cassa' ? sc.getBoundingClientRect().width : 0;
    var bh = br && getComputedStyle(br).display !== 'none' ? br.getBoundingClientRect().height : 0;
    return {left: 0, width: w - sw, bottom: bh};
  };
  var toastBase = X.toast, ultimaFusa = 0;
  X.toast = function (msg, tipo) {
    try { if (window.Totore && (tipo === 'err' || (tipo === 'ok' && Date.now() - ultimaFusa > 20000))) { if (tipo === 'ok') ultimaFusa = Date.now(); Totore.reagisci(tipo); } } catch (e) {}
    return toastBase.apply(this, arguments);
  };

  X.aiuto('Come si usa la cassa', ['In alto a destra scegli la cassa: Bar di tutti i giorni oppure la cassa di un evento, con prezzi suoi e piatti del giorno.', 'Tocca i prodotti per metterli nello scontrino; con − e + cambi le quantità.', 'Scegli Contanti o Carta. Con Contanti il tastierino calcola il resto.', 'Se hai sbagliato, tocca Annulla nel messaggio verde subito dopo la vendita (oppure dalla scheda Oggi).', 'Omaggio / consumo staff: per ciò che non si paga; conta nei consumi ma non entra in cassa.', 'Senza rete funziona lo stesso: in alto vedi quante vendite aspettano di essere inviate.', 'A fine serata: Chiudi cassa, conta i contanti e conferma.', 'Scheda Scorte: Conta quando fai l’inventario, + Arrivati quando arriva la spesa, − Usati per ciò che si prende fuori dalle vendite. Le bevande collegate al listino scendono da sole a ogni vendita.']);
  X.scorteInit({reparti: ['Bar', 'Pulizie e sede'], operatore: operatore, chiediOp: function (poi) { scegliOperatore(poi); }, dopo: function () { segnaOperazione(); if (S.vista === 'scorte') render(); }});
  X.avvia('bar', {
    onStato: suStato,
    onChiave: function () { X.salvaChiave(''); setup(); },
    onEsiti: function () { if (S.vista === 'oggi') render(); }
  });
  if (!X.chiave()) setup(); else render();
})();
</script>
</body>
</html>
