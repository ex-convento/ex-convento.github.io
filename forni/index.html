<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forni · Ex Convento</title>
<meta name="theme-color" content="#0d0b09">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forni Ex Convento">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Josefin+Sans:wght@600;700&display=swap">
<link rel="stylesheet" href="../comune.css">
<style>
  .wrap{padding:16px;max-width:1200px;margin:0 auto}
  .forni{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .forno{background:var(--sup);border-radius:22px;box-shadow:var(--ombra);overflow:hidden;display:flex;flex-direction:column}
  .forno .fh{padding:14px 18px;color:#fff;background:var(--fc);display:flex;justify-content:space-between;align-items:center}
  .forno .fh b{font:700 22px/1 var(--display);letter-spacing:.06em}
  .forno .fh{flex-wrap:wrap;gap:4px 10px}
  .forno .fh small{opacity:.85;font-weight:700;font-size:13px}
  .forno .fb{padding:16px 18px;flex:1;display:flex;flex-direction:column;gap:10px}
  .st{display:flex;align-items:center;gap:12px}
  .st .pall{width:18px;height:18px;border-radius:50%;background:var(--sc);box-shadow:0 0 0 6px color-mix(in srgb,var(--sc) 20%,transparent);flex:none}
  .st .pall.pulse{animation:pu 1.6s infinite}
  @keyframes pu{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--sc) 8%,transparent)}}
  .st b{font:700 26px/1 var(--display)}
  .timer{font:700 40px/1 var(--display);letter-spacing:.02em}
  .det{color:var(--muted);line-height:1.5}
  .det b{color:var(--ink)}
  .fa{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
  .fa .full{grid-column:1/-1}
  .oggi{border-top:1px solid var(--linea);padding-top:10px;font-size:15px}
  .oggi .r{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
  .giorni{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
  .giorni::-webkit-scrollbar{display:none}
  .gg{flex:none;min-width:64px;padding:8px 10px;border-radius:14px;background:var(--sup);box-shadow:var(--ombra);text-align:center;font-weight:700}
  .gg small{display:block;font-size:12px;color:var(--muted);text-transform:uppercase}
  .gg b{font:700 22px/1.1 var(--display)}
  .gg.on{background:var(--nero);color:#fff}.gg.on small{color:var(--ambra)}
  .pren{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
  .slot{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--linea)}
  .slot .d{flex:1}
  .slot small{display:block;color:var(--muted)}
  .tbl{width:100%;border-collapse:collapse}
  .tbl td,.tbl th{padding:10px 8px;border-bottom:1px solid var(--linea);text-align:left;vertical-align:top}
  .tbl th{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .tbl td:first-child{font:700 20px/1.1 var(--display);white-space:nowrap}
  .ev{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--linea);align-items:flex-start}
  .ev .dot{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none;background:var(--sc)}
  .ev .d{flex:1}
  .ev small{display:block;color:var(--muted)}
  /* mappa del forno */
  .giorni .mese{flex:none;align-self:center;font:700 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 4px 0 8px}
  .fcard{background:var(--sup);border-radius:22px;box-shadow:var(--ombra);padding:16px;display:flex;flex-direction:column;gap:12px}
  .fhd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .fhd h3{margin:0;color:var(--fc);font-size:20px}
  .fhd small{color:var(--muted);font-weight:700}
  .tfix{font-size:14px;font-weight:700;border-radius:10px;padding:8px 12px;background:var(--sup2);color:var(--muted)}
  .tfix.on{background:color-mix(in srgb,var(--fc) 14%,var(--sup));color:var(--ink)}
  .ovn{position:relative;border:6px solid var(--fc);border-radius:18px 18px 10px 10px;padding:10px;background:linear-gradient(180deg,color-mix(in srgb,var(--fc) 6%,var(--sup)),var(--sup));display:flex;flex-direction:column;gap:0}
  .ovn::after{content:"";position:absolute;left:18%;right:18%;bottom:-14px;height:8px;border-radius:0 0 8px 8px;background:var(--fc);opacity:.55}
  .rip{height:7px;border-radius:4px;background:color-mix(in srgb,var(--fc) 45%,#8a8378);margin:8px 2px}
  .zona{width:100%;border-radius:12px;border:2px dashed color-mix(in srgb,var(--fc) 40%,var(--linea));background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;padding:6px;color:var(--ink);transition:background .15s,transform .08s;min-width:0}
  .zona:active{transform:scale(.97)}
  .zona b{font:700 17px/1.1 var(--display);letter-spacing:.04em}
  .zona small{font-size:13px;color:var(--muted);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .zona.z-mezzo{min-height:150px}
  .zona.z-rip{min-height:66px}
  .ogg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .zona.z-o{min-height:64px}
  .zona.z-o b{font-size:15px}
  .zona.preso{border-style:solid;border-color:transparent;background:color-mix(in srgb,var(--fc) 82%,#000);color:#fff}
  .zona.preso small{color:rgba(255,255,255,.85)}
  .zona.preso.attesa{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--fc) 70%,#000) 0 10px,color-mix(in srgb,var(--fc) 55%,#000) 10px 20px)}
  .zona.sel{border-style:solid;border-color:var(--ambra);background:var(--ambra-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--ambra) 35%,transparent)}
  .zona.sel b::before{content:"\2713  ";color:var(--ambra-ink)}
  .ovn.intero .zona.preso{border-radius:6px}
  .fint{display:flex;gap:8px;margin-top:10px}
  .fint .btn{flex:1;min-height:48px}
  .selbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--nero);color:#fff;border-radius:14px;padding:10px 12px}
  .selbar span{flex:1 1 100%;font-weight:700}
  .selbar .btn{flex:1}
  .selbar span b{display:block;font:700 22px/1.1 var(--display);color:var(--ambra)}
  .selbar .btn{min-height:46px}
  .manuali{font-size:14px;color:var(--muted);border-top:1px solid var(--linea);padding-top:8px}
  .legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:700;margin:0 0 12px}
  .legenda i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:2px dashed #b9b2a4}
  .legenda i.p{background:#4f4a42;border:0}.legenda i.s{background:var(--ambra-soft);border:2px solid var(--ambra)}
  .pers{margin:4px 0 14px;border:1px solid var(--linea);border-radius:var(--r-sm);padding:10px 14px}
  .pers summary{font-weight:700;cursor:pointer;color:var(--muted)}
  .riep{display:flex;justify-content:space-between;align-items:baseline;background:var(--sup2);border-radius:var(--r-sm);padding:12px 14px;font-weight:700;margin-bottom:6px}
  .riep b{font:700 26px/1 var(--display)}
  @media (max-width:520px){.wrap{padding:12px}.timer{font-size:34px}.forno .fb{padding:14px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="../logo.png" alt="" width="45" height="34"><div><b>EX CONVENTO</b><small>Forni</small></div></div>
  <div class="spazio"></div>
  <span id="sync" class="sync">…</span>
  <a id="torna" class="chip" href="../pubblico/" style="display:none;text-decoration:none">‹ Torna all'inizio</a>
  <button id="opBtn" class="chip vuoto">Chi sei?</button>
</header>
<nav class="tabs" id="viste">
  <button class="tab on" data-v="stato">Stato forni</button>
  <button class="tab" data-v="pren">Prenotazioni</button>
  <button class="tab" data-v="temp">Temperature</button>
  <button class="tab" data-v="storico">Storico</button>
  <button class="tab" data-v="scorte" id="tabScorte">Scorte</button>
</nav>
<main id="app"></main>
<dialog id="dlg"></dialog>

<script src="../comune.js"></script>
<script>
(function () {
  'use strict';
  var X = window.EXC, $ = function (s, r) { return (r || document).querySelector(s); };
  var dlg = $('#dlg');
  var STATI = {
    libero: {nome: 'Libero', c: '#1b7a4a'},
    carico: {nome: 'Caricato', c: '#94660a'},
    cottura: {nome: 'In cottura', c: '#b33f28'},
    raffreddamento: {nome: 'Raffreddamento', c: '#2f6f9a'},
    problema: {nome: 'Problema', c: '#7d1f12'},
    prenotato: {nome: 'Prenotato', c: '#4f4a42'},
    pagato: {nome: 'Pagato', c: '#1b7a4a'}
  };
  var S = {vista: 'stato', giorno: new Date().getDate(), srv: null, dataSel: X.oggi(), sel: null};

  function colForno(t) { t = t.toUpperCase(); return t.indexOf('BLU') >= 0 ? '#2f6f9a' : t.indexOf('ROSSO') >= 0 ? '#b33f28' : t.indexOf('GRANDE') >= 0 ? '#94660a' : t.indexOf('BIANCO') >= 0 ? '#7d8a83' : '#4f4a42'; }
  function nomeForno(t) { return t.replace(/^FORNO\s+/i, 'Forno ').replace(/\b(\w)(\w*)/g, function (m, a, b) { return a + b.toLowerCase(); }).replace(/^Forno/, 'Forno'); }
  var PUB = X.pubblico();
  function operatore() { return PUB ? (S.opTemp || '') : X.get('operatore', ''); }
  function dimentica() { if (PUB) setTimeout(function () { S.opTemp = ''; render(); }, 0); }
  function locali() { return X.get('eventi', []); }
  function tabs() { return (S.srv && S.srv.forni && S.srv.forni.tabs) || ['FORNO BLU', 'FORNO ROSSO', 'FORNO GRANDE', 'FORNO BIANCO']; }

  /* ---------- tabella temperature e misure dei forni (dal foglio PRENOTAZIONI) ---------- */
  function info() {
    var v = (S.srv && S.srv.forni && S.srv.forni.info && S.srv.forni.info.ok) ? S.srv.forni.info.values : [];
    var temp = [], misure = {};
    v.forEach(function (r) {
      var a = String(r[0] || '').trim();
      if (/^\d{3,4}\s*°?C$/i.test(a)) temp.push({t: a.replace(/\s/g, ''), m: String(r[1] || '').trim()});
      else if (/^forno\s/i.test(a)) misure[a.split(/\s+/)[1].toUpperCase()] = {dim: String(r[1] || '').trim(), max: String(r[2] || '').trim()};
    });
    return {temp: temp, misure: misure};
  }
  function misura(t) { var m = info().misure, k = t.replace(/^FORNO\s+/i, '').toUpperCase(); return m[k] || null; }

  /* ---------- stato di ogni forno: ultimo evento (gestionale + eventi locali non ancora arrivati) ---------- */
  function statoDi(t) {
    var best = (S.srv && S.srv.forni && S.srv.forni.stato && S.srv.forni.stato[t]) || null;
    locali().forEach(function (e) { if (e.tipo === 'forno' && e.forno === t && (!best || e.quando > best.quando)) best = e; });
    return best || {stato: 'libero', quando: '', operatore: ''};
  }
  function prenotazioni(t, d) {
    var p = S.srv && S.srv.forni && S.srv.forni.prenotazioni && S.srv.forni.prenotazioni[t];
    var g = p && p.ok && p.values ? p.values[d] : null;
    var righe = g ? g.righe.slice() : [];
    var inCoda = X.coda().map(function (c) { return c.id; });
    locali().forEach(function (e) {
      if (e.tipo === 'prenotazione' && e.forno === t && Number(e.giorno) === Number(d) && inCoda.indexOf(e.id) >= 0) righe.push([e.artista, e.quantita, e.temperatura, e.note, 'attesa']);
    });
    return {righe: righe, libere: g ? Math.max(0, g.libere - righe.filter(function (r) { return r[4] === 'attesa'; }).length) : null, esiste: !!g};
  }

  /* ---------- mappa dei posti ---------- */
  var POSTI = ['mezzo', 'ripiano', 'o1', 'o2', 'o3', 'o4'];
  function numT(x) { var m = String(x || '').replace(',', '.').match(/\d+(\.\d+)?/); return m ? Number(m[0]) : null; }
  function mappa(t, data) {
    var srv = (S.srv && S.srv.forni && S.srv.forni.mappa && S.srv.forni.mappa.ok) ? S.srv.forni.mappa.values : [];
    var coda = X.coda(), annullate = {};
    coda.forEach(function (c) { if (c.tipo === 'mappaAnnulla') annullate[c.rif] = 1; });
    var ids = {}, out = [];
    srv.forEach(function (r) { ids[r.id] = 1; if (r.forno === t && r.data === data && r.stato === 'prenotato' && !annullate[r.id]) out.push(r); });
    coda.forEach(function (c) { if (c.tipo === 'mappa' && !ids[c.id] && c.forno === t && c.data === data) out.push({id: c.id, forno: c.forno, data: c.data, posti: c.posti, nome: c.nome, temperatura: c.temperatura, note: c.note, prezzo: c.importo !== '' && c.importo != null ? Number(c.importo) : prezzo(t, c.posti, c.temperatura), listino: prezzo(t, c.posti, c.temperatura), motivo: c.motivo || '', attesa: true, quando: c.quando}); });
    return out.sort(function (a, b) { return String(a.quando).localeCompare(String(b.quando)); });
  }
  function occupati(lista) { var o = {}; lista.forEach(function (r) { (r.posti || []).forEach(function (x) { o[x] = r; }); }); return o; }
  function tempFissa(lista) { var r = lista.filter(function (x) { return x.temperatura; })[0]; return r ? {t: r.temperatura, chi: r.nome} : null; }
  function listini(t) { var p = S.srv && S.srv.forni && S.srv.forni.prezzi && S.srv.forni.prezzi.ok ? S.srv.forni.prezzi.values : {}; return p[t] || null; }
  function prezzo(t, posti, temp) {
    var p = listini(t); if (!p || !posti || !posti.length) return null;
    var n = numT(temp), l = (n && n >= 1200 && p.alto) ? p.alto : p.base;
    if (posti.indexOf('intero') >= 0) return l.intero;
    var tot = 0; posti.forEach(function (x) { tot += Number(x === 'mezzo' ? l.mezzo : x === 'ripiano' ? l.ripiano : l.oggetto) || 0; });
    return Math.round(tot * 100) / 100;
  }
  function etichetta(posti) {
    if (!posti || posti.indexOf('intero') >= 0) return 'forno intero';
    var o = posti.filter(function (x) { return /^o\d$/.test(x); }).length;
    return [posti.indexOf('mezzo') >= 0 ? 'mezzo forno' : '', posti.indexOf('ripiano') >= 0 ? '1 ripiano' : '', o ? o + (o === 1 ? ' oggetto' : ' oggetti') : ''].filter(String).join(' + ');
  }
  function euroC(n) { return n == null ? '' : (Math.round(n) === n ? n + ' €' : X.euro(n)); }
  function normPosti(p) { return POSTI.every(function (x) { return p.indexOf(x) >= 0; }) ? ['intero'] : p; }
  function giorniLista() { var out = [], d = new Date(); for (var i = 0; i < 35; i++) { out.push(X.oggi(d)); d.setDate(d.getDate() + 1); } return out; }

  function durata(iso) {
    var t = new Date(iso).getTime(); if (!t) return '';
    var m = Math.max(0, Math.floor((Date.now() - t) / 60000)), h = Math.floor(m / 60);
    return h + ':' + (m % 60 < 10 ? '0' : '') + (m % 60);
  }

  /* ---------- viste ---------- */
  function render() {
    document.querySelectorAll('#viste .tab').forEach(function (t) { t.classList.toggle('on', t.dataset.v === S.vista); });
    var op = operatore(), ob = $('#opBtn'); ob.textContent = op ? op : 'Chi sei?'; ob.classList.toggle('vuoto', !op); ob.style.display = PUB ? 'none' : '';
    var tb = $('#torna'); if (tb) tb.style.display = PUB ? '' : 'none';
    var a = $('#app');
    if (S.vista === 'stato') a.innerHTML = vStato();
    else if (S.vista === 'pren') a.innerHTML = vPren();
    else if (S.vista === 'temp') a.innerHTML = vTemp();
    else if (S.vista === 'scorte' && !PUB) a.innerHTML = X.vScorte(X.scorteFiltro());
    else a.innerHTML = vStorico();
    var ts = $('#tabScorte'); if (ts) { ts.style.display = PUB ? 'none' : ''; var nb = X.scorteBasse(); ts.innerHTML = 'Scorte' + (nb ? ' <span class="badge ros">' + nb + '</span>' : ''); }
  }
  function vStato() {
    var oggi = new Date().getDate();
    return '<div class="wrap"><div class="forni">' + tabs().map(function (t) {
      var s = statoDi(t), st = STATI[s.stato] || STATI.libero, mis = misura(t), pr = prenotazioni(t, oggi);
      var h = '<article class="forno" style="--fc:' + colForno(t) + '"><div class="fh"><b>' + X.esc(nomeForno(t).toUpperCase()) + '</b><small>' + (mis ? X.esc(mis.dim + ' · ' + mis.max) : '') + '</small></div><div class="fb">' +
        '<div class="st" style="--sc:' + st.c + '"><span class="pall' + (s.stato === 'cottura' ? ' pulse' : '') + '"></span><b>' + st.nome + '</b></div>';
      if (s.stato !== 'libero' && s.quando) h += '<div class="timer">' + durata(s.quando) + '<span class="muted" style="font-size:16px;font-weight:700"> ore:min</span></div>';
      var det = [];
      if (s.operatore) det.push('<b>' + X.esc(s.operatore) + '</b>');
      if (s.quando) det.push('dalle ' + X.ora(s.quando) + (s.quando.slice(0, 10) !== X.oggi() ? ' del ' + s.quando.slice(8, 10) + '/' + s.quando.slice(5, 7) : ''));
      if (s.temperatura) det.push(X.esc(s.temperatura));
      if (s.pezzi) det.push(X.esc(s.pezzi));
      if (det.length) h += '<div class="det">' + det.join(' · ') + (s.note ? '<br>' + X.esc(s.note) : '') + '</div>';
      h += '<div class="fa">' + azioni(t, s.stato) + '</div>';
      h += '<div class="oggi"><b>Oggi</b>' + (pr.righe.length ? pr.righe.map(function (r) { return '<div class="r"><span>' + X.esc(r[0] || '—') + (r[4] ? ' <span class="badge ara">da inviare</span>' : '') + '</span><span class="muted">' + X.esc([r[1], r[2]].filter(String).join(' · ')) + '</span></div>'; }).join('') : '<div class="muted">Nessuna prenotazione</div>') + '</div>';
      return h + '</div></article>';
    }).join('') + '</div></div>';
  }
  function azioni(t, stato) {
    var b = function (cls, act, txt, full) { return '<button class="btn ' + cls + (full ? ' full' : '') + '" data-act="' + act + '" data-f="' + X.esc(t) + '">' + txt + '</button>'; };
    if (stato === 'libero') return b('prim big', 'carica', 'Carica il forno', true) + b('lin', 'pren', 'Prenota') + b('lin', 'paga', 'Incassa infornata');
    if (stato === 'carico') return b('ros big', 'cottura', 'Avvia cottura', true) + b('lin', 'libera', 'Annulla carico') + b('lin', 'problema', 'Problema');
    if (stato === 'cottura') return b('blu big', 'raffredda', 'Fine cottura', true) + b('lin', 'problema', 'Problema', true);
    if (stato === 'raffreddamento') return b('ver big', 'scarica', 'Scaricato, forno libero', true) + b('lin', 'paga', 'Incassa infornata') + b('lin', 'problema', 'Problema');
    return b('ver big', 'libera', 'Risolto, forno libero', true) + b('lin', 'nota', 'Aggiungi nota', true);
  }
  function giorniMese() {
    var d = new Date(), fine = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(), out = [];
    for (var i = d.getDate(); i <= fine; i++) out.push(i);
    return out;
  }
  function vPren() {
    var gs = giorniLista(), nomi = ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab'], mesi = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
    if (gs.indexOf(S.dataSel) < 0) S.dataSel = gs[0];
    var mPrec = '', h = '<div class="wrap"><div class="giorni">';
    gs.forEach(function (iso, i) {
      var dt = new Date(iso + 'T12:00:00'), m = mesi[dt.getMonth()];
      if (m !== mPrec && i) h += '<span class="mese">' + m + '</span>'; mPrec = m;
      h += '<button class="gg' + (iso === S.dataSel ? ' on' : '') + '" data-gd="' + iso + '"><small>' + (i === 0 ? 'oggi' : nomi[dt.getDay()]) + '</small><b>' + dt.getDate() + '</b></button>';
    });
    h += '</div><div class="legenda"><span><i></i>Libero: tocca per scegliere</span><span><i class="p"></i>Prenotato</span><span><i class="s"></i>Scelto da te</span></div><div class="pren">';
    h += tabs().map(cardForno).join('');
    return h + '</div><p class="muted" style="font-size:14px">Ogni forno ha sopra il mezzo forno, in mezzo un ripiano e sotto 4 posti per oggetti singoli. Il prezzo è la somma dei posti scelti (il forno intero ha il suo prezzo). Chi prenota per primo decide la temperatura della cottura.</p></div>';

    if (d.v) { S.vista = d.v; render(); window.scrollTo(0, 0); return; }
    if (d.gg) { S.giorno = Number(d.gg); render(); return; }
    if (d.gd) { S.dataSel = d.gd; S.sel = null; render(); return; }
    if (d.z) return toccaZona(d.f, d.z, d.rid);
    if (d.zint) { var tt = d.zint; if (S.sel && S.sel.forno === tt && normPosti(S.sel.posti)[0] === 'intero') S.sel = null; else S.sel = {forno: tt, posti: POSTI.slice()}; render(); return; }
    if (d.sc) { [].forEach.call(t.parentNode.querySelectorAll('.scelta'), function (b) { b.classList.toggle('on', b === t); });
      if (t.parentNode.dataset.gruppo === 'mtemp' && S.sel && $('#mPr')) { var pz = prezzo(S.dlgForno, normPosti(S.sel.posti.slice()), d.sc); $('#mPr').textContent = pz != null ? X.euro(pz) : ''; }
      return; }
    if (d.op) { [].forEach.call(document.querySelectorAll('[data-op]'), function (b) { b.classList.toggle('on', b === t); }); $('#opNome').value = ''; return; }
    if (t.id === 'opBtn') return scegliOperatore();
    switch (d.act) {
      case 'x': return chiudiDlg();
      case 'carica': return chiedi(function () { formCarica(f); });
      case 'cottura': return chiedi(function () { formCottura(f); });
      case 'raffredda': return chiedi(function () { evento(f, 'raffreddamento', {temperatura: statoDi(f).temperatura || ''}); });
      case 'scarica': return chiedi(function () { evento(f, 'libero', {note: 'scaricato'}); });
      case 'libera': return chiedi(function () { evento(f, 'libero', {note: statoDi(f).stato === 'problema' ? 'problema risolto' : 'carico annullato'}); });
      case 'problema': return chiedi(function () { formNota(f, 'problema', 'Segnala un problema'); });
      case 'nota': return chiedi(function () { formNota(f, 'problema', 'Aggiungi nota'); });
      case 'pren': S.vista = 'pren'; S.dataSel = X.oggi(); S.sel = null; render(); window.scrollTo(0, 0); return;
      case 'selNo': S.sel = null; return render();
      case 'mPren': return formMappa(f);
      case 'mConf': return confMappa(f);
      case 'mAnn': return chiedi(function () { annullaMappa(f, d.rid); });
      case 'mPaga': { var rr = mappa(f, S.dataSel).filter(function (x) { return x.id === d.rid; })[0]; return chiedi(function () { formPaga(f, rr ? {nome: rr.nome, importo: rr.prezzo} : {}); }); }
      case 'paga': return chiedi(function () { formPaga(f); });
      case 'confCarica': return confCarica(f, d.dopo);
      case 'confCottura': return evento(f, 'cottura', {temperatura: valScelta('temp'), note: $('#fNote').value.trim().slice(0, 300), pezzi: statoDi(f).pezzi || ''});
      case 'confNota': { var n = $('#nT').value.trim(); if (!n) return X.toast('Scrivi due parole su cosa succede.', 'err'); return evento(f, d.st, {note: n.slice(0, 300)}); }
      case 'confPren': {
        var a = PUB ? X.nomePulito($('#pA').value) : X.ricordaNome($('#pA').value); if (!a) return X.toast('Scrivi il nome di chi prenota.', 'err');
        var g = Number($('#pG').value);
        var e = X.accoda({tipo: 'prenotazione', forno: f, giorno: g, artista: a.slice(0, 120), quantita: $('#pQ').value.trim().slice(0, 120), temperatura: valScelta('ptemp'), note: $('#pN').value.trim().slice(0, 300), quando: X.adesso(), operatore: operatore()});
        var l = locali(); l.push(e); X.set('eventi', l.slice(-80)); S.giorno = g; chiudiDlg(); render(); dimentica(); X.toast('Prenotato ' + nomeForno(f) + ' il ' + g, 'ok', {label: 'Annulla', fn: function () { annullaInCoda(e.id, 'Prenotazione'); }}); return;
      }
      case 'confPaga': {
        var imp = Number(($('#iImp').value || '').replace(',', '.')); if (!(imp > 0)) return X.toast('Importo non valido.', 'err');
        var chi = X.nomePulito($('#iChi').value); if (!chi) return X.toast('Scrivi chi paga.', 'err');
        var p = X.accoda({tipo: 'incasso', forno: f, importo: Math.round(imp * 100) / 100, metodo: valScelta('met') || 'contanti', data: X.oggi(), causale: 'Infornata ' + chi + ' · ' + nomeForno(f), cassa: 'LAB INFORNATE', quando: X.adesso(), operatore: operatore()});
        var l2 = locali(); l2.push(p); X.set('eventi', l2.slice(-80)); chiudiDlg(); render(); dimentica(); X.toast('Incasso registrato · ' + X.euro(p.importo), 'ok', {label: 'Annulla', fn: function () { annullaInCoda(p.id, 'Incasso'); }}); return;
      }
      case 'pulisciErr': X.set('errori', []); X.aggiornaStato(); return render();
      case 'setK': return provaChiave();
      case 'opOk': {
        var sel = document.querySelector('[data-op].on'), nome = ($('#opNome').value || '').trim() || (sel ? sel.dataset.op : '');
        if (!nome) return X.toast('Scegli o scrivi un nome.', 'err');
        if (nome.length < 2) return X.toast('Scrivi nome e cognome.', 'err');
        if (PUB) S.opTemp = X.nomePulito(nome); else X.set('operatore', X.ricordaNome(nome)); chiudiDlg(); render(); var poi = S.dopoOp; S.dopoOp = null; if (poi) poi(); return;
      }
    }
  });
  dlg.addEventListener('click', function (ev) { if (ev.target === dlg) chiudiDlg(); });

  X.aiuto('Come si usano i forni', ['Ogni scheda è un forno: vedi se è libero, caricato, in cottura o in raffreddamento, da quanto e chi l’ha usato.', 'Carica il forno → Avvia cottura → Fine cottura → Scaricato: ogni passaggio resta registrato con il tuo nome.', 'Hai toccato il pulsante sbagliato? Tocca Annulla nel messaggio verde.', 'Prenotazioni: scegli il giorno, poi tocca i posti nel disegno del forno (mezzo forno, ripiano, oggetti) o "Forno intero". Il prezzo si calcola da solo.', 'Incassa infornata registra il pagamento nella cassa dell’associazione.', 'Senza rete funziona lo stesso: le operazioni partono quando torna la connessione.', 'Scheda Scorte (laboratorio e forni): Conta quando controlli quanto resta, + Arrivati quando arriva il materiale, − Usati quando lo prendi. Sotto la soglia il direttivo riceve l’avviso.']);
  if (!PUB) X.scorteInit({reparti: ['Laboratorio', 'Forni'], operatore: operatore, chiediOp: function (poi) { scegliOperatore(poi); }, dopo: function () { if (S.vista === 'scorte') render(); }});
  X.avvia('forni', {
    onStato: function (s) {
      S.srv = s;
      var srvIds = {}; ((s.forni && s.forni.storico) || []).forEach(function (e) { srvIds[e.id] = 1; });
      var inCoda = X.coda().map(function (c) { return c.id; });
      X.set('eventi', locali().filter(function (e) { return inCoda.indexOf(e.id) >= 0 || !srvIds[e.id]; }).slice(-80));
      if (!dlg.open && !document.querySelector('#scDlg[open]')) render();
    },
    onChiave: function () { X.salvaChiave(''); setup(); },
    onTick: function () { if (!dlg.open && S.vista === 'stato') render(); }
  });
  if (!X.chiave()) setup(); else { S.srv = X.stato(); render(); }
  setInterval(function () { if (!dlg.open && S.vista === 'stato') render(); }, 30000);
  if (PUB) {
    var ultimo = Date.now();
    ['pointerdown', 'keydown'].forEach(function (t) { document.addEventListener(t, function () { ultimo = Date.now(); }, true); });
    setInterval(function () { if (Date.now() - ultimo > 180000) location.href = '../pubblico/'; }, 15000);
  }
})();
</script>
</body>
</html>
