<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ex Convento · Gestionale</title>
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ex Convento">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f1efea; }
  #wait { position: fixed; inset: 0; display: grid; place-items: center; color: #FEA501; font: 600 18px system-ui, sans-serif; letter-spacing: .12em; }
</style>
</head>
<body>
<div id="wait">EX CONVENTO</div>
<iframe id="app" title="Gestionale Ex Convento" allow="clipboard-write; web-share"></iframe>
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbwr4sZBvrhmavAtTrBXbNJ0OOsS1yxozXwtbxEpMfuKVz2CDW30YTztDrllZOAfkBuC-Q/exec';
  var k = new URLSearchParams(location.search).get('k') || '';
  try {
    if (k) localStorage.setItem('excv_k', k);
    else k = localStorage.getItem('excv_k') || '';
  } catch (e) {}
  var f = document.getElementById('app');
  f.onload = function () { var w = document.getElementById('wait'); if (w) w.remove(); };
  f.src = APP + (k ? '?k=' + encodeURIComponent(k) : '');
</script>
</body>
</html>
