<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ex Convento</title>
<meta name="theme-color" content="#0d0b09">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ex Convento">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Josefin+Sans:wght@600;700&display=swap">
<link rel="stylesheet" href="../comune.css">
<style>
  .wrap{padding:18px;max-width:1200px;margin:0 auto}
  .saluto{font:700 30px/1.1 var(--display);margin:6px 0 2px}
  .data{color:var(--muted);margin-bottom:16px}
  .azioniHome{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:18px}
  .big{display:flex;align-items:center;gap:16px;text-align:left;background:var(--sup);border-radius:22px;box-shadow:var(--ombra);padding:20px;min-height:104px;text-decoration:none;color:var(--ink)}
  .big .ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px;flex:none;background:var(--c)}
  .big b{display:block;font:700 21px/1.15 var(--display)}
  .big small{color:var(--muted);font-size:15px}
  .big:active{transform:scale(.98)}
  .col2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
  .riga{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--linea)}
  .riga:last-child{border-bottom:0}
  .riga .d{min-width:0}
  .riga small{display:block;color:var(--muted)}
  .tag{font-weight:700;color:var(--ocra)}
  .tag.ok{color:var(--verde)}
  .pall{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .avv{border-left:5px solid var(--ambra);padding:10px 14px;background:var(--sup2);border-radius:10px;margin:8px 0}
  .avv.imp{border-color:var(--rosso);background:var(--rosso-soft)}
  .avv b{display:block}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .tile{background:var(--sup);border-radius:var(--r);box-shadow:var(--ombra);padding:16px;text-align:left;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;border-top:6px solid var(--verde)}
  .tile .e{font-size:28px}
  .tile b{font-size:18px}
  .tile small{color:var(--muted)}
  .riepilogo{background:var(--verde-soft);color:var(--verde);border-radius:var(--r-sm);padding:14px 16px;font-weight:700;margin-top:14px;line-height:1.5}
  .info{background:var(--blu-soft);color:var(--blu);border-radius:var(--r-sm);padding:12px 14px;font-weight:700;font-size:15px;margin-bottom:14px}
  .giorno{margin-bottom:14px}
  .giorno h3{display:flex;justify-content:space-between;align-items:baseline}
  .ev{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--linea)}
  .ev .q{flex:none;width:58px;text-align:center;background:var(--nero);color:#fff;border-radius:14px;padding:6px 0}
  .ev .q small{display:block;color:var(--ambra);font-weight:700;font-size:12px;text-transform:uppercase}
  .ev .q b{font:700 24px/1 var(--display)}
  .ev .d{flex:1}
  .ev .d small{display:block;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="../logo.png" alt="" width="45" height="34"><div><b>EX CONVENTO</b><small>Benvenuti</small></div></div>
  <div class="spazio"></div>
  <span id="sync" class="sync">…</span>
</header>
<nav class="tabs" id="viste">
  <button class="tab on" data-v="home">Oggi</button>
  <button class="tab" data-v="cassa">Registra un pagamento</button>
  <a class="tab" href="../forni/" style="text-decoration:none">Forni e prenotazioni</a>
  <button class="tab" data-v="cal">Turni ed eventi</button>
  <button class="tab" data-v="avvisi">Avvisi</button>
</nav>
<main id="app"></main>
<dialog id="dlg"></dialog>

<script src="../comune.js"></script>
<script>
(function () {
  'use strict';
  var X = window.EXC, $ = function (s, r) { return (r || document).querySelector(s); };
  try { localStorage.setItem('excv_modo', 'pubblico'); } catch (e) {}
  var dlg = $('#dlg');
  var VOCI = [
    {id: 'tessera', e: '🪪', label: 'Tessera socio', cat: 'CONTRIBUTO', imp: 5, pre: 'Tessera', per: 'Nome e cognome del socio'},
    {id: 'infornata', e: '🔥', label: 'Infornata', cat: 'LAB INFORNATE', pre: 'Infornata', per: 'Di chi sono i pezzi'},
    {id: 'ticket', e: '🎟️', label: 'Ticket laboratorio', cat: 'LAB TICKETS', imp: 10, pre: 'Ticket', per: 'Nome'},
    {id: 'bar', e: '☕', label: 'Incasso bar', cat: 'BAR', pre: 'Bar', per: 'es. caffè e birre'},
    {id: 'donazione', e: '🤝', label: 'Donazione', cat: 'CONTRIBUTO', pre: 'Donazione', per: 'Da chi (facoltativo)'},
    {id: 'evento', e: '🎉', label: 'Incasso evento', cat: 'EVENTI', pre: 'Evento', per: 'Quale evento'}
  ];
  var MESI = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
  var GIORNI = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
  var STATI = {libero: ['Libero', '#1b7a4a'], carico: ['Caricato', '#94660a'], cottura: ['In cottura', '#b33f28'], raffreddamento: ['Raffreddamento', '#2f6f9a'], problema: ['Problema', '#7d1f12']};
  var S = {vista: 'home', srv: null, voce: null};

  function P() { return (S.srv && S.srv.pubblico) || {}; }
  function dataLunga(iso) { var d = new Date(iso + 'T12:00:00'); return GIORNI[d.getDay()] + ' ' + d.getDate() + ' ' + MESI[d.getMonth()]; }
  function nomeForno(t) { return t.replace(/^FORNO\s+/i, 'Forno ').toLowerCase().replace(/(^|\s)\S/g, function (c) { return c.toUpperCase(); }); }

  /* ---------- viste ---------- */
  function render() {
    document.querySelectorAll('#viste .tab').forEach(function (t) { t.classList.toggle('on', t.dataset.v === S.vista); });
    var a = $('#app');
    if (!X.chiave()) return setup();
    a.innerHTML = S.vista === 'cassa' ? vCassa() : S.vista === 'cal' ? vCal() : S.vista === 'avvisi' ? vAvvisi() : vHome();
  }
  function vHome() {
    var h = new Date().getHours(), oggi = X.oggi(), p = P();
    var out = '<div class="wrap"><div class="saluto">' + (h < 13 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera') + '!</div><div class="data">' + dataLunga(oggi).replace(/^./, function (c) { return c.toUpperCase(); }) + '</div>';
    out += '<div class="azioniHome">' +
      '<button class="big" data-v="cassa" style="--c:var(--verde-soft)"><span class="ic">💶</span><span><b>Registra un pagamento</b><small>Tessere, infornate, ticket, bar…</small></span></button>' +
      '<a class="big" href="../forni/" style="--c:var(--ocra-soft)"><span class="ic">🔥</span><span><b>Forni e prenotazioni</b><small>Carica un forno, prenota una cottura</small></span></a>' +
      '<button class="big" data-v="cal" style="--c:var(--blu-soft)"><span class="ic">📅</span><span><b>Turni ed eventi</b><small>Chi apre e cosa succede</small></span></button></div>';
    out += '<div class="col2"><div class="card"><h3>Oggi in sede</h3>' + turniGiorno(oggi) + '</div>';
    out += '<div class="card"><h3>Forni adesso</h3>' + statoForni() + '<a class="btn lin full" href="../forni/" style="margin-top:10px;text-decoration:none">Apri forni e prenotazioni</a></div>';
    var ev = (p.eventi || []).slice(0, 3);
    out += '<div class="card"><h3>Prossimi eventi</h3>' + (ev.length ? ev.map(evHtml).join('') : '<div class="muted">Nessun evento in programma.</div>') + '</div>';
    var av = (p.avvisi || []).filter(function (a) { return a.fissa || a.priorita === 'importante'; }).slice(0, 3);
    if (av.length) out += '<div class="card"><h3>Avvisi</h3>' + av.map(avvHtml).join('') + '</div>';
    return out + '</div></div>';
  }
  function turniGiorno(d) {
    var p = P(), fasce = p.fasce || [{id: 'mattina', nome: 'Mattina', orario: ''}, {id: 'pomeriggio', nome: 'Pomeriggio', orario: ''}];
    return fasce.map(function (f) {
      var t = (p.turni || []).filter(function (x) { return x.data === d && x.fascia === f.id; })[0];
      var chi = t && t.persone ? t.persone : '';
      return '<div class="riga"><div class="d"><b>' + X.esc(f.nome) + '</b> <span class="muted">' + X.esc(f.orario || '') + '</span>' + (t && t.note ? '<small>' + X.esc(t.note) + '</small>' : '') + '</div><span class="tag' + (chi ? ' ok' : '') + '">' + (chi ? X.esc(chi) : 'Scoperto') + '</span></div>';
    }).join('');
  }
  function statoForni() {
    var f = (S.srv && S.srv.forni) || {}, tabs = f.tabs || [];
    if (!tabs.length) return '<div class="muted">In arrivo…</div>';
    return tabs.map(function (t) {
      var s = (f.stato && f.stato[t]) || {stato: 'libero'}, st = STATI[s.stato] || STATI.libero;
      return '<div class="riga"><span><span class="pall" style="background:' + st[1] + '"></span><b>' + X.esc(nomeForno(t)) + '</b></span><span style="color:' + st[1] + ';font-weight:700">' + st[0] + (s.stato !== 'libero' && s.quando ? ' · dalle ' + X.ora(s.quando) : '') + '</span></div>';
    }).join('');
  }
  function evHtml(e) {
    var d = new Date(e.data + 'T12:00:00');
    return '<div class="ev"><div class="q"><small>' + MESI[d.getMonth()] + '</small><b>' + d.getDate() + '</b></div><div class="d"><b>' + X.esc(e.titolo) + '</b><small>' + X.esc([GIORNI[d.getDay()], e.ora ? 'ore ' + e.ora + (e.oraFine ? '–' + e.oraFine : '') : '', e.luogo].filter(Boolean).join(' · ')) + '</small>' + (e.descrizione ? '<div class="muted" style="margin-top:4px">' + X.esc(e.descrizione) + '</div>' : '') + '</div></div>';
  }
  function avvHtml(a) { return '<div class="avv' + (a.priorita === 'importante' ? ' imp' : '') + '"><b>' + X.esc(a.titolo) + '</b>' + X.esc(a.testo).replace(/\n/g, '<br>') + (a.firma ? '<div class="muted" style="margin-top:4px">— ' + X.esc(a.firma) + '</div>' : '') + '</div>'; }

  function vCassa() {
    var out = '<div class="wrap"><h2>Registra un pagamento</h2><div class="info">Si registrano solo entrate. Ogni pagamento viene salvato con il tuo nome e il direttivo lo vede evidenziato.</div><div class="tiles">' +
      VOCI.map(function (v) { return '<button class="tile" data-voce="' + v.id + '"><span class="e">' + v.e + '</span><span><b>' + v.label + '</b><br><small>' + (v.imp ? X.euro(v.imp) : 'importo libero') + '</small></span></button>'; }).join('') + '</div>';
    out += '<div class="card" style="margin-top:18px"><h3>Pagamenti registrati oggi</h3>' + listaOggi() + '</div>';
    return out + '</div>';
  }
  function listaOggi() {
    var coda = X.coda().filter(function (c) { return c.tipo === 'entrata'; });
    var srv = P().entrateOggi || [];
    var h = coda.map(function (c) { return '<div class="riga"><div class="d"><b>' + X.esc(c.causale) + '</b><small>' + X.esc(c.nome) + ' · ' + (c.metodo === 'carta' ? 'carta' : 'contanti') + ' · <span class="badge ara">da inviare</span></small></div><b>' + X.euro(c.importo) + '</b></div>'; }).join('');
    h += srv.map(function (r) { return '<div class="riga"><div class="d"><b>' + X.esc(r.causale) + '</b><small>' + X.esc([r.chi, r.met === 'Qonto' ? 'carta' : (r.met || '').toLowerCase(), r.cat].filter(Boolean).join(' · ')) + '</small></div><b>' + X.euro(r.importo) + '</b></div>'; }).join('');
    var err = X.errori().filter(function (e) { return e.tipo === 'entrata'; });
    if (err.length) h += '<div style="margin-top:10px;color:var(--rosso);font-weight:700">Non registrati: ' + err.map(function (e) { return X.esc(e.causale + ' (' + e.errore + ')'); }).join('; ') + '</div>';
    return h || '<div class="muted">Ancora nessun pagamento oggi.</div>';
  }
  function vCal() {
    var p = P(), out = '<div class="wrap"><div class="col2"><div><h2>Turni di apertura</h2>';
    for (var i = 0; i < 7; i++) {
      var d = X.oggi(new Date(Date.now() + i * 864e5));
      out += '<div class="card giorno"><h3><span>' + (i === 0 ? 'Oggi' : i === 1 ? 'Domani' : dataLunga(d).replace(/^./, function (c) { return c.toUpperCase(); })) + '</span><small class="muted">' + (i < 2 ? dataLunga(d) : '') + '</small></h3>' + turniGiorno(d) + '</div>';
    }
    out += '<p class="muted">Per segnarti a un turno chiedi a un membro del direttivo.</p></div><div><h2>Eventi</h2><div class="card">' + ((p.eventi || []).length ? p.eventi.map(evHtml).join('') : '<div class="muted">Nessun evento in programma.</div>') + '</div></div></div>';
    return out + '</div>';
  }
  function vAvvisi() {
    var av = P().avvisi || [];
    return '<div class="wrap"><h2>Avvisi</h2><div class="card">' + (av.length ? av.map(avvHtml).join('') : '<div class="muted">Nessun avviso.</div>') + '</div></div>';
  }

  /* ---------- registrazione pagamento ---------- */
  function apriVoce(id) {
    var v = VOCI.filter(function (x) { return x.id === id; })[0]; if (!v) return;
    S.voce = v;
    dlg.innerHTML = '<div class="dlg-h"><h2>' + v.e + ' ' + X.esc(v.label) + '</h2><button class="dlg-x" data-act="x" aria-label="Chiudi">×</button></div><div class="dlg-b">' +
      '<label class="campo"><span>Importo (€)</span><input id="cImp" inputmode="decimal" value="' + (v.imp ? String(v.imp) : '') + '" placeholder="es. 15"></label>' +
      '<label class="campo"><span>' + X.esc(v.per) + '</span><input id="cPer" autocomplete="off"></label>' +
      '<div class="campo"><span>Come ha pagato?</span><div class="scelte" id="cMet"><button class="scelta on" data-met="contanti">Contanti</button><button class="scelta" data-met="carta">Carta / POS</button></div></div>' +
      '<label class="campo"><span>Il tuo nome e cognome (chi registra)</span><input id="cChi" autocomplete="off" placeholder="Obbligatorio"></label>' +
      '<button class="btn ver big full" data-act="conferma">Continua</button></div>';
    dlg.showModal();
    setTimeout(function () { var i = v.imp ? $('#cPer') : $('#cImp'); if (i) i.focus(); }, 60);
  }
  function conferma() {
    var v = S.voce, imp = Number(String($('#cImp').value).replace(',', '.')), per = $('#cPer').value.trim(), chi = $('#cChi').value.trim();
    var met = ($('#cMet .on') || {}).dataset ? $('#cMet .on').dataset.met : 'contanti';
    if (!(imp > 0)) return X.toast('Scrivi l\'importo.', 'err');
    if (imp > 500) return X.toast('Per importi sopra i 500 € chiedi al direttivo.', 'err');
    if (v.id !== 'donazione' && v.id !== 'bar' && !per) return X.toast('Compila: ' + v.per.toLowerCase() + '.', 'err');
    if (chi.length < 3 || chi.indexOf(' ') < 0) return X.toast('Scrivi il tuo nome e cognome.', 'err');
    S.bozza = {tipo: 'entrata', importo: Math.round(imp * 100) / 100, cat: v.cat, metodo: met, data: X.oggi(), quando: X.adesso(), nome: chi.slice(0, 80), causale: (v.pre + (per ? ' ' + per : '')).slice(0, 160)};
    $('.dlg-b', dlg).innerHTML = '<div class="riepilogo">' + X.esc(S.bozza.causale) + '<br>' + X.euro(S.bozza.importo) + ' · ' + (met === 'carta' ? 'carta / POS' : 'contanti') + '<br>Registrato da ' + X.esc(S.bozza.nome) + '</div>' +
      '<p class="muted">' + (met === 'contanti' ? 'Ricordati di mettere i contanti nella cassa.' : 'Conferma solo se il pagamento col POS è andato a buon fine.') + '</p>' +
      '<div class="azioni"><button class="btn lin" data-voce="' + v.id + '">Modifica</button><button class="btn ver big" data-act="salva">Conferma</button></div>';
  }
  function salva() {
    if (!S.bozza) return;
    X.accoda(S.bozza); var b = S.bozza; S.bozza = null;
    dlg.close(); S.vista = 'cassa'; render();
    X.toast('Registrato: ' + X.euro(b.importo) + ' · grazie ' + b.nome.split(' ')[0] + '!', 'ok');
  }

  /* ---------- configurazione ---------- */
  function setup() {
    $('#viste').style.display = 'none';
    $('#app').innerHTML = '<div class="setup"><div class="card"><h2>Configura il computer pubblico</h2><p class="muted">Apri su questo computer il link "Postazione Pubblica" che trovi nella scheda Accessi, oppure incolla qui la chiave.</p><label class="campo"><span>Chiave</span><input id="kIn" autocomplete="off"></label><button class="btn prim full big" data-act="setK">Collega</button></div></div>';
  }
  function provaChiave() {
    var v = ($('#kIn').value || '').trim(), m = v.match(/[?&]k=([^&]+)/); if (m) v = decodeURIComponent(m[1]); if (!v) return;
    X.salvaChiave(v);
    X.call('init').then(function (j) {
      try { localStorage.setItem('excv_forni_chiave', v); } catch (e) {}
      $('#viste').style.display = ''; X.sync(true); X.toast('Collegato: ' + j.postazione, 'ok'); render();
    }, function (e) { X.salvaChiave(''); X.toast(e.server ? 'Chiave non valida.' : 'Serve la rete per collegarsi.', 'err'); });
  }

  /* ---------- torna all'inizio dopo 2 minuti senza tocchi ---------- */
  var ultimo = Date.now();
  ['pointerdown', 'keydown'].forEach(function (t) { document.addEventListener(t, function () { ultimo = Date.now(); }, true); });
  setInterval(function () {
    if (Date.now() - ultimo < 120000) return;
    ultimo = Date.now(); S.bozza = null;
    if (dlg.open) dlg.close();
    if (S.vista !== 'home') { S.vista = 'home'; render(); window.scrollTo(0, 0); }
  }, 10000);

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button'); if (!t) return;
    var d = t.dataset;
    if (d.v) { S.vista = d.v; render(); window.scrollTo(0, 0); return; }
    if (d.voce) { if (dlg.open) dlg.close(); return apriVoce(d.voce); }
    if (d.met) { [].forEach.call(t.parentNode.children, function (b) { b.classList.toggle('on', b === t); }); return; }
    if (d.act === 'x') return dlg.close();
    if (d.act === 'conferma') return conferma();
    if (d.act === 'salva') return salva();
    if (d.act === 'setK') return provaChiave();
  });
  dlg.addEventListener('click', function (ev) { if (ev.target === dlg) dlg.close(); });

  X.avvia('pubblico', {
    extra: 'pubblico',
    onStato: function (s) {
      S.srv = s;
      try { if (X.chiave() && !localStorage.getItem('excv_forni_chiave')) localStorage.setItem('excv_forni_chiave', X.chiave()); } catch (e) {}
      if (!dlg.open) render();
    },
    onChiave: function () { X.salvaChiave(''); setup(); },
    onEsiti: function () { if (S.vista === 'cassa' && !dlg.open) render(); },
    onTick: function () { if (!dlg.open && S.vista === 'home') render(); }
  });
  S.srv = X.stato();
  render();
})();
</script>
</body>
</html>
